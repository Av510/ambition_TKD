<a href="{{ url_for('student')}}">Back</a>

<form method="POST" action="{{ url_for('create_student') }}">
    Name:
    <input type = "text" name ="name">
    <br>
    Surname:
    <input type = "text" name ="surname">
    <br>
    <label for="attendance_card_id">Attendance card ID:</label>
    <select name="attendance_card_id">
      <p>card id | name | attendance count</p>
      {% for cards in at_d %}
        <option value="{{cards}}">
            {{cards}}: 
            {% for i in at_d[cards] %}
              |
              {{i[0]}} {{i[1]}}
              |
            {% endfor %}
            {{at_d[cards][0][3]}}
        </option>
      {% endfor %}
    </select>
    <label> ADD new card:</label>
    <input type="checkbox" name="new_card">
    <br>
    Contact:

    <br>
    Phone:
    <input type="text"name="phone">
    <br>   
    Email:
    <input type="text"name="email">
    <br>   
    Relationship to student:
    <input type="text"name="relationship_to_student">
       
    <br>
    Contact 2 (if there is):
    <br>
    Phone:
    <input type="text"name="phone2">
    <br>   
    Email:
    <input type="text"name="email2">
    <br>   
    Relationship to student:
    <input type="text"name="relationship_to_student2">
       
    <br>

    <input type="hidden" name="which_form" value="change_classes">
    {% for c in classes %}
        <input type="checkbox" name="class_ids" value="{{c[0]}}" > 
        <label for="{{c[0]}}">{{c[1]}} - {{c[2]}} </label><br>
        <br>
    {% endfor %}


    <button type="submit">
      Save
    </button>
</form>
