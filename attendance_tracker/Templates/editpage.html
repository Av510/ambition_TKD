<h4>{{student_id}}</h4>
<form method="POST" action="{{ url_for('update_student', student_id=student_id) }}">
    First name:
    <input type="text"
           name="first_name"
           value="{{student[1]}}">

    Surname:
    <input type="text"
           name="surname"
           value="{{student[2]}}">

    Attendance card ID:
    <input type="text"
           name="attendance_card_id"
           value="{{student[3]}}">

    <button type="submit">
        Save
    </button>
</form>
