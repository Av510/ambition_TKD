<h4>Student info:</h4>
<h4>{{student_id}}</h4>
<form method="POST" action="{{ url_for('update_student', student_id=student_id) }}">
    <h4>{{student_id}}</h4>
    First name:
    <input type="text"
           name="first_name"
           value="{{student[1]}}">

    Surname:
    <input type="text"
           name="surname"
           value="{{student[2]}}">

    Attendance card ID:
    <input type="text"
           name="attendance_card_id"
           value="{{student[3]}}">


    <h4>Contacts info:</h4>
    {% for c in contacts %}
       Contact ID: {{c[0]}} 

       Phone: {{c[1]}}

       Email: {{c[2]}}
       
       Relationship to student: {{c[3]}}
       <br>
       {% endfor %}

      <button type="submit">
          Save
      </button>
    

</form>
