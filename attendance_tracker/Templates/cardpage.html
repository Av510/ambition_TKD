        {% for i in attedance_cards_d %}
          <tr>
              <td>{{i}}</td>
              {% for t in attedance_cards_d[i] %}
                    <td>{{t[0]}}</td>
                    <td>{{t[1]}}</td>
                    <td>{{t[2]}}</td>
                    <td>{{t[3]}}</td>
                    <td>{{t[4]}}</td>
              {% endfor %}
              
              {% for b in range(10) %}
                  <form method="POST" action="/updateattendance">
                      <input type = "hidden" name ="cardid" value = "{{i}}">
                      {% if b < (attedance_cards_d[i][0][4] or 0) %}
                          <input type = "hidden" name ="attendancechange" value = "-1">
                          <button type = "submit">o</button>
                      {% else %}
                      <input type = "hidden" name ="attendancechange" value = "1">
                      <button type = "submit">-</button>
                      {% endif %}
                  </form>
              {% endfor %}
         </tr>
          {% endfor %}
