{% for student in student_d %}
    
    <p>Card ID: {{ student }}</p>
    
    {% for name in student_d[student] %}
    {% if loop.index > 1 %}
        {% if loop.last %} and {% else %}, {% endif %}
    {% endif %}
    {{ name }}
    {% endfor %}
    's payment is due!

        <form method="POST" action="/clearcard">

            <input type="hidden" name="cardid" value="{{ student }}">
            <input type="hidden" name="og_page" value="{{ request.path }}">

            <button type="submit" onclick="return confirm('Are you sure you want to clear this card\'s attendance?')">
                 CLEAR
            </button>

        </form>
{% endfor %}
