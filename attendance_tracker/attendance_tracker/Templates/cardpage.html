        {% for i in acards %}
          <tr>
              <td> {{i[0]}} </td>
              <td> {{i[1]}} </td>
              <td> {{i[2]}} </td>
              <td> {{i[3]}} </td>
              <td> {{i[4]}} </td>
              {% for b in range(10) %}
                  <form method="POST" action="/updateattendance">
                      <input type = "hidden" name ="cardid" value = "{{i[3]}}">
                      {% if b < (i[4] or 0) %}
                          <input type = "hidden" name ="attendancechange" value = "-1">
                          <button type = "submit">o</button>
                      {% else %}
                      <input type = "hidden" name ="attendancechange" value = "1">
                      <button type = "submit">-</button>
                      {% endif %}
                  </form>
              {% endfor %}
         </tr>
          {% endfor %}
